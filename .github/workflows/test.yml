name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: |
          cd boilerplate/contract
          npm run compact 2>/dev/null || npm run build

      - name: Vendor contracts to frontend
        run: npm run vendor

      - name: Run unit + negative-path tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nighthire-test-report
          path: |
            boilerplate/contract-cli/reports/
            **/reports/
